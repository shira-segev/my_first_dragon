<head>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<div class="container">

<h1>Sleep</h1>
<pre>{{ my_pet.sleep_explanation() }}</pre>

<form method="POST">
    <input type="number" name="hours" min="1">

    <button type="submit">Enter</button>
</form>

<p>Energy: <progress value="{{ my_pet.energy }}" max="100"></progress></p>

{% if message %}
    <p>{{ message }}</p>
{% endif %}

<br>
<a href="{{ url_for('actions_page', name=name) }}">Back</a>
